name: Build and release APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Daylight-debug.apk
          gh release create "$RELEASE_TAG" Daylight-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Daylight build #${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT})" \
            --notes "Install Daylight-debug.apk on Android 8.0 or newer. This is a debug build; builds may use different signing keys, so updating may require uninstalling the previous version and deleting its local data." \
            --latest
